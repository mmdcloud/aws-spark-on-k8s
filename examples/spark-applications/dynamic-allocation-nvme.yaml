# ==============================================================================
# High-Performance SparkApplication with Local NVMe Scratch Volumes for Shuffle
# ==============================================================================
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: spark-nvme-shuffle
  namespace: spark-apps
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: 895885662937.dkr.ecr.us-west-2.amazonaws.com/spark/spark-py:3.5.3-hadoop3
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///opt/spark/examples/src/main/python/sort.py
  sparkVersion: 3.5.3
  restartPolicy:
    type: OnFailure

  volumes:
    - name: spark-local-dir-nvme
      emptyDir: {}

  sparkConf:
    "spark.eventLog.enabled": "true"
    "spark.eventLog.dir": "s3a://<EVENT_LOG_BUCKET>/spark-event-logs"
    "spark.hadoop.fs.s3a.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
    "spark.hadoop.fs.s3a.aws.credentials.provider": "com.amazonaws.auth.WebIdentityTokenCredentialsProvider"

    # Route Spark shuffle and spill writes to high-speed local NVMe mount
    "spark.local.dir": "/tmp/spark-local-dir"

    # Dynamic Allocation with Shuffle Tracking
    "spark.dynamicAllocation.enabled": "true"
    "spark.dynamicAllocation.shuffleTracking.enabled": "true"
    "spark.dynamicAllocation.minExecutors": "4"
    "spark.dynamicAllocation.maxExecutors": "30"

    # I/O Compression using LZ4 or Zstandard
    "spark.io.compression.codec": "lz4"
    "spark.shuffle.compress": "true"
    "spark.shuffle.spill.compress": "true"

  driver:
    cores: 2
    memory: "4096m"
    serviceAccount: spark-sa
    labels:
      spark-role: driver
    nodeSelector:
      spark-role: driver
    tolerations:
      - key: spark-role
        value: driver
        effect: NoSchedule

  executor:
    cores: 4
    memory: "16384m"
    memoryOverhead: "3072m"
    labels:
      spark-role: executor
    volumeMounts:
      - name: spark-local-dir-nvme
        mountPath: /tmp/spark-local-dir
    nodeSelector:
      spark-role: executor
    tolerations:
      - key: spark-role
        value: executor
        effect: NoSchedule
